<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Course</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;
        }

        /* Navbar */

        nav {
            background: #1f2937;
            padding: 18px 40px;
            display: flex;
            align-items: center;
            gap: 25px;
        }

        nav h2 {
            color: white;
            margin-right: auto;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        nav a:hover {
            color: #60a5fa;
        }

        /* Main container */

        .container {
            width: 90%;
            max-width: 700px;
            margin: 50px auto;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .form-card h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #1f2937;
        }

        /* Form */

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #374151;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
        }

        .form-group textarea {
            min-height: 130px;
            resize: vertical;
        }

        /* Buttons */

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .update-btn,
        .cancel-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 7px;
            text-align: center;
            text-decoration: none;
            font-size: 16px;
            cursor: pointer;
        }

        .update-btn {
            background: #2563eb;
            color: white;
        }

        .update-btn:hover {
            background: #1d4ed8;
        }

        .cancel-btn {
            background: #e5e7eb;
            color: #374151;
        }

        .cancel-btn:hover {
            background: #d1d5db;
        }

        /* Mobile */

        @media (max-width: 600px) {

            nav {
                padding: 15px;
                flex-wrap: wrap;
            }

            nav h2 {
                width: 100%;
                margin-bottom: 10px;
            }

            .container {
                width: 95%;
                margin: 30px auto;
            }

            .form-card {
                padding: 25px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <nav>

        <h2>🎓 Student Management</h2>

        <a href="{% url 'dashboard' %}">Dashboard</a>

        <a href="{% url 'add_student' %}">Add Student</a>

        <a href="{% url 'courses' %}">Courses</a>

    </nav>


    <div class="container">

        <div class="form-card">

            <h1>✏️ Edit Course</h1>

            <form method="POST">

                {% csrf_token %}

                <div class="form-group">

                    <label for="name">Course Name</label>

                    <input type="text" id="name" name="name" value="{{ course.name }}" required>

                </div>


                <div class="form-group">

                    <label for="duration">Duration</label>

                    <input type="text" id="duration" name="duration" value="{{ course.duration }}" required>

                </div>


                <div class="form-group">

                    <label for="description">Description</label>

                    <textarea id="description" name="description" required>{{ course.description }}</textarea>

                </div>


                <div class="buttons">

                    <button type="submit" class="update-btn">
                        Update Course
                    </button>

                    <a href="{% url 'courses' %}" class="cancel-btn">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
