<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6f8;
        }

        nav {
            background: #1f2937;
            padding: 18px 40px;
        }

        nav h2 {
            color: white;
            display: inline;
            margin-right: 40px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 12px;
        }

        nav a:hover {
            color: #60a5fa;
        }

        .container {
            width: 90%;
            margin: 40px auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #1f2937;
        }

        .add-btn {
            background: #2563eb;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 6px;
        }

        .add-btn:hover {
            background: #1d4ed8;
        }

        .course-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .course-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .course-card h2 {
            color: #2563eb;
            margin-top: 0;
        }

        .course-card p {
            color: #555;
        }

        .buttons {
            margin-top: 20px;
        }

        .edit {
            background: #f59e0b;
            color: white;
            padding: 8px 14px;
            text-decoration: none;
            border-radius: 5px;
        }

        .delete {
            background: #dc2626;
            color: white;
            padding: 8px 14px;
            text-decoration: none;
            border-radius: 5px;
            margin-left: 8px;
        }

        .empty {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <nav>
        <h2>🎓 Student Management</h2>

        <a href="{% url 'dashboard' %}">Dashboard</a>
        <a href="{% url 'add_student' %}">Add Student</a>
        <a href="{% url 'courses' %}">Courses</a>
        <a href="{% url 'logout' %}">Logout</a>
    </nav>

    <div class="container">

        <div class="header">
            <h1>Courses</h1>

            <a href="{% url 'add_course' %}" class="add-btn">
                + Add Course
            </a>
        </div>

        <div class="course-container">

            {% for course in courses %}

            <div class="course-card">

                <h2>{{ course.name }}</h2>

                <p>
                    <strong>Duration:</strong>
                    {{ course.duration }}
                </p>

                <p>
                    <strong>Description:</strong><br>
                    {{ course.description }}
                </p>

                <div class="buttons">

                    <a href="{% url 'edit_course' course.id %}" class="edit">
                        Edit
                    </a>

                    <a href="{% url 'delete_course' course.id %}" class="delete"
                        onclick="return confirm('Are you sure you want to delete this course?');">
                        Delete
                    </a>

                </div>

            </div>

            {% empty %}

            <div class="empty">
                <h2>No Courses Available</h2>
                <p>Add your first course.</p>
            </div>

            {% endfor %}

        </div>

    </div>

</body>

</html>
